# Managed by Terraform in katzkevin/github-management (terraform/shared/files/claude.yml).
# Local edits are overwritten on the next reconciliation; change it there instead.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Lets Claude read CI results on pull requests.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # No github_token input: the action authenticates as the Claude GitHub
        # App so that CI runs on the commits it pushes.
        # Pinned to an exact release: v1.0.218 (Claude Code 2.1.265) ships a
        # native installer that leaves no binary on ubuntu runners. Bump here
        # after verifying a newer release on one repository.
        uses: anthropics/claude-code-action@v1.0.217
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 60
